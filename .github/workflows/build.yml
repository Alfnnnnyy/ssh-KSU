name: Build & Release RemoteSH (arm64-v8a)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip patch make autoconf git

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build Svelte 5 WebUI into module/webroot
        working-directory: webui
        run: |
          npm ci
          npm run check
          npm run build

      - name: Install Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Cross-compile rmshctl, Dropbear, and playit-agent
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build.sh

      - name: Package KernelSU/APatch/Magisk zip and checksums
        run: |
          bash scripts/package.sh
          (cd dist && sha256sum *.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload module zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotesh-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
